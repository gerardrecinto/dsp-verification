name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dsp-verification .
      - name: Run the regression and publish its results with the site
        run: |
          docker run --rm --user root -v "$PWD:/dv" -w /dv dsp-verification python dv/regress.py --seeds 20
          cp results/summary.json site/results.json
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deployment
        uses: actions/deploy-pages@v4
